<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#059669" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Money Note" />
    <title>Money Note — レシート家計簿</title>
    <!--
      PWA manifest & icons are injected at runtime rather than written as static
      <link> tags: Bun's HTML bundler would otherwise try to resolve these
      root-absolute URLs at build time. They are served from ../public by the
      server (see index.ts).
    -->
    <script>
      for (const attrs of [
        { rel: "manifest", href: "/manifest.webmanifest" },
        { rel: "icon", type: "image/png", sizes: "32x32", href: "/favicon-32.png" },
        { rel: "icon", type: "image/png", sizes: "192x192", href: "/icon-192.png" },
        { rel: "apple-touch-icon", href: "/apple-touch-icon.png" },
      ]) {
        const el = document.createElement("link");
        for (const k in attrs) el.setAttribute(k, attrs[k]);
        document.head.appendChild(el);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./frontend.tsx"></script>
  </body>
</html>
